# Batas memori diturunkan supaya laptop dengan RAM 8 GB tidak lag saat build.
# Kalau build gagal dengan "OutOfMemoryError", naikkan -Xmx2G menjadi -Xmx3G.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx1G
# Batasi jumlah proses build paralel agar CPU tidak penuh 100%.
org.gradle.workers.max=2
org.gradle.caching=true
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
